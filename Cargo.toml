[package]
name = "linkora"
version = "1.0.0"
description = "A free, offline, open-source link manager"
authors = ["Andreas"]
license = "MIT"
repository = "https://github.com/Hyrican/linkora"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "linkora"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2.3"
tauri-plugin-shell = "2.3"
